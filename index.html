<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
}

#container {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
}

h1, #finalScreen {
    font-family: 'Great Vibes', cursive;
    color: white;
}

h1 {
    font-size: clamp(2.8rem, 6vw, 4rem);
    margin-top: 120px;
}

#finalScreen {
    display: none;
    font-size: clamp(3rem, 6vw, 4.2rem);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

button {
    padding: 12px 28px;
    font-size: 1.1rem;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    position: absolute;
}

#yes {
    background: #ff4d6d;
    color: white;
}

#no {
    background: #333;
    color: white;
}

/* hearts */
.heart {
    position: fixed;
    top: -20px;
    animation: fall linear forwards;
}

@keyframes fall {
    to { transform: translateY(110vh); opacity: 0; }
}
</style>
</head>
<body>

<div id="container">
    <h1 id="question">Will you be my Valentine? 💖</h1>

    <button id="yes">Yes 💘</button>
    <button id="no">No 😢</button>

    <div id="finalScreen">Now you are mine forever ❤️</div>
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const question = document.getElementById("question");
const finalScreen = document.getElementById("finalScreen");

let yesClicks = 0;

// initial centered placement
function centerButtons() {
    const w = window.innerWidth;

    yesBtn.style.left = w / 2 - 140 + "px";
    noBtn.style.left  = w / 2 + 20 + "px";

    yesBtn.style.top = "260px";
    noBtn.style.top  = "260px";
}

centerButtons();
window.addEventListener("resize", centerButtons);

// move anywhere but stay in screen
function moveButton(btn) {
    const padding = 20;

    const maxX = window.innerWidth - btn.offsetWidth - padding;
    const maxY = window.innerHeight - btn.offsetHeight - padding;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

// NO always escapes
noBtn.addEventListener("click", () => moveButton(noBtn));

// YES escapes until final
yesBtn.addEventListener("click", () => {
    yesClicks++;

    if (yesClicks < 10) {
        moveButton(yesBtn);
    } else {
        yesBtn.style.display = "none";
        noBtn.style.display = "none";
        question.style.display = "none";
        finalScreen.style.display = "block";
        startHearts();
    }
});

function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.fontSize = (12 + Math.random() * 22) + "px";
        heart.style.animationDuration = (2 + Math.random() * 3) + "s";

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 150);
}
</script>

</body>
</html>
